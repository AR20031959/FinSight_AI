publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  http: ^1.2.1
  intl: ^0.20.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  open_file: ^3.3.2
  lottie: ^3.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
